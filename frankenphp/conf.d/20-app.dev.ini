; Memory limit for development (can be higher for debugging)
memory_limit = 512M

; Local Docker Desktop runs are often much slower than production, especially
; during first-page loads, cache rebuilds, network-heavy Nostr calls, and
; console commands. Do not inherit the production 30s execution cap in dev.
max_execution_time = 0
default_socket_timeout = 120

; See https://docs.docker.com/desktop/networking/#i-want-to-connect-from-a-container-to-a-service-on-the-host
; See https://github.com/docker/for-linux/issues/264
; The `client_host` below may optionally be replaced with `discover_client_host=yes`
; Add `start_with_request=yes` to start debug session on each request
xdebug.client_host = host.docker.internal
