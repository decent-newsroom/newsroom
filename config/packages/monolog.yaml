monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - workspace_metrics

when@dev:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: warning
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!doctrine", "!deprecation", "!workspace_metrics"]
                buffer_size: 100
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                max_files: 3
            stderr:
                type: stream
                path: php://stderr
                level: warning
                channels: ["!event", "!doctrine", "!deprecation", "!workspace_metrics"]
            deprecation:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.deprecations.log"
                level: debug
                channels: [deprecation]
                max_files: 3
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console", "!workspace_metrics"]
            workspace_metrics:
                type: stream
                path: php://stderr
                level: warning
                channels: [workspace_metrics]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!workspace_metrics"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            workspace_metrics:
                type: stream
                path: php://stderr
                level: warning
                channels: [workspace_metrics]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!workspace_metrics"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!workspace_metrics"]
            workspace_metrics:
                type: stream
                path: php://stderr
                level: warning
                channels: [workspace_metrics]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
