# Unfold Bundle Routes
# Mount these routes for subdomain-based site rendering
# These routes only match when UnfoldRequestListener has identified a valid Unfold subdomain
# The listener sets _unfold_site request attribute for registered subdomains

# Demo route for testing subdomain setup
unfold_demo:
    path: /demo
    controller: DecentNewsroom\UnfoldBundle\Controller\DemoController::index
    methods: [GET]
    condition: "request.attributes.has('_unfold_site')"

# Theme assets route - must come before catch-all
# Uses /unfold-themes/ to avoid conflict with Symfony AssetMapper which handles /assets/
unfold_theme_assets:
    path: /unfold-themes/{theme}/{path}
    controller: DecentNewsroom\UnfoldBundle\Controller\ThemeAssetController
    requirements:
        theme: '[a-zA-Z0-9_-]+'
        path: '.+'
    methods: [GET]
    condition: "request.attributes.has('_unfold_site')"

# Publication discovery documents
unfold_rss:
    path: /rss.xml
    controller: DecentNewsroom\UnfoldBundle\Controller\DiscoveryController::rss
    methods: [GET]
    condition: "request.attributes.has('_unfold_site')"

unfold_feed:
    path: /feed.xml
    controller: DecentNewsroom\UnfoldBundle\Controller\DiscoveryController::feed
    methods: [GET]
    condition: "request.attributes.has('_unfold_site')"

unfold_category_rss:
    path: /{category}/rss.xml
    controller: DecentNewsroom\UnfoldBundle\Controller\DiscoveryController::categoryRss
    requirements:
        category: '[^/]+'
    methods: [GET]
    condition: "request.attributes.has('_unfold_site')"

unfold_sitemap:
    path: /sitemap.xml
    controller: DecentNewsroom\UnfoldBundle\Controller\DiscoveryController::sitemap
    methods: [GET]
    condition: "request.attributes.has('_unfold_site')"

unfold_robots:
    path: /robots.txt
    controller: DecentNewsroom\UnfoldBundle\Controller\DiscoveryController::robots
    methods: [GET]
    condition: "request.attributes.has('_unfold_site')"

# Main site controller - catch-all
unfold_site:
    path: /{path}
    controller: DecentNewsroom\UnfoldBundle\Controller\SiteController
    requirements:
        path: '.*'
    defaults:
        path: ''
    condition: "request.attributes.has('_unfold_site')"
