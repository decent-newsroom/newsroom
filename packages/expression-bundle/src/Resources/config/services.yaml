services:
    _defaults:
        autowire: true
        autoconfigure: true

    DecentNewsroom\ExpressionBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../ExpressionBundle.php'

    DecentNewsroom\ExpressionBundle\Controller\FeedApiController:
        tags: ['controller.service_arguments']

    DecentNewsroom\ExpressionBundle\Runner\ExpressionRunner:
        arguments:
            $operationIterable: !tagged_iterator 'expression.operation'
            $expressionMaxExecutionTime: '%expression.max_execution_time%'

    DecentNewsroom\ExpressionBundle\Runner\Operation\ScoreOperation:
        arguments:
            $normalizerIterable: !tagged_iterator 'expression.normalizer'
        tags: ['expression.operation']

    DecentNewsroom\ExpressionBundle\Runner\Operation\AllFilterOperation:
        tags: ['expression.operation']
    DecentNewsroom\ExpressionBundle\Runner\Operation\AnyFilterOperation:
        tags: ['expression.operation']
    DecentNewsroom\ExpressionBundle\Runner\Operation\NoneFilterOperation:
        tags: ['expression.operation']
    DecentNewsroom\ExpressionBundle\Runner\Operation\SortOperation:
        tags: ['expression.operation']
    DecentNewsroom\ExpressionBundle\Runner\Operation\SliceOperation:
        tags: ['expression.operation']
    DecentNewsroom\ExpressionBundle\Runner\Operation\DistinctOperation:
        tags: ['expression.operation']
    DecentNewsroom\ExpressionBundle\Runner\Operation\UnionOperation:
        tags: ['expression.operation']
    DecentNewsroom\ExpressionBundle\Runner\Operation\IntersectOperation:
        tags: ['expression.operation']
    DecentNewsroom\ExpressionBundle\Runner\Operation\DifferenceOperation:
        tags: ['expression.operation']
    DecentNewsroom\ExpressionBundle\Runner\Operation\ParentOperation:
        tags: ['expression.operation']
    DecentNewsroom\ExpressionBundle\Runner\Operation\ChildOperation:
        tags: ['expression.operation']
    DecentNewsroom\ExpressionBundle\Runner\Operation\AncestorOperation:
        tags: ['expression.operation']
    DecentNewsroom\ExpressionBundle\Runner\Operation\DescendantOperation:
        tags: ['expression.operation']

    DecentNewsroom\ExpressionBundle\Runner\Normalizer\IdentityNormalizer:
        tags: ['expression.normalizer']
    DecentNewsroom\ExpressionBundle\Runner\Normalizer\RecencyNormalizer:
        tags: ['expression.normalizer']
    DecentNewsroom\ExpressionBundle\Runner\Normalizer\LogNormalizer:
        tags: ['expression.normalizer']
    DecentNewsroom\ExpressionBundle\Runner\Normalizer\InNormalizer:
        tags: ['expression.normalizer']
    DecentNewsroom\ExpressionBundle\Runner\Normalizer\ContainsCiNormalizer:
        tags: ['expression.normalizer']
    DecentNewsroom\ExpressionBundle\Runner\Normalizer\CountNormalizer:
        tags: ['expression.normalizer']

    DecentNewsroom\ExpressionBundle\Service\FeedCacheService:
        arguments:
            $cache: '@cache.app'
            $expressionCacheTtl: '%expression.cache_ttl%'

    DecentNewsroom\ExpressionBundle\Source\SourceResolverInterface:
        alias: DecentNewsroom\ExpressionBundle\Source\SourceResolver

    # Explicit definition so we can inject the real Monolog logger as the default
    # delegate — without this, the auto-resolution would loop back onto the bind above.
    DecentNewsroom\ExpressionBundle\Logging\LoggerSwitch:
        arguments:
            $default: '@logger'
        public: true
